<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Morrow stablecoin-native receivables credit market</title>
  <desc id="desc">A blue and white Morrow banner showing invoice, funding auction, and settlement nodes connected by a USDC rail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#DBEAFE"/></linearGradient>
    <linearGradient id="rail" x1="110" y1="0" x2="1490" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#2563EB"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1E3A8A" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="220" fill="#BFDBFE" opacity=".42"/><circle cx="130" cy="500" r="250" fill="#E0E7FF" opacity=".55"/>
  <g opacity=".24" stroke="#2563EB"><path d="M0 110H1600M0 210H1600M0 310H1600M0 410H1600"/><path d="M160 0V520M360 0V520M560 0V520M760 0V520M960 0V520M1160 0V520M1360 0V520"/></g>
  <text x="110" y="126" fill="#0F172A" font-family="Georgia, serif" font-size="76" letter-spacing="-3">Morrow<tspan fill="#2563EB">.</tspan></text>
  <text x="114" y="175" fill="#475569" font-family="Arial, sans-serif" font-size="25">Stablecoin-native receivables credit on Arc</text>
  <path d="M168 331H1430" stroke="url(#rail)" stroke-width="8" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="104" y="258" width="255" height="146" rx="18" fill="white" stroke="#BFDBFE" stroke-width="2"/><circle cx="145" cy="300" r="18" fill="#DBEAFE"/><path d="M138 300h14M145 293v14" stroke="#2563EB" stroke-width="2"/><text x="176" y="300" fill="#0F172A" font-family="Arial, sans-serif" font-size="19" font-weight="700">Invoice</text><text x="128" y="350" fill="#64748B" font-family="Arial, sans-serif" font-size="16">Buyer accepts the obligation</text><text x="128" y="375" fill="#2563EB" font-family="Arial, sans-serif" font-size="15" font-weight="700">USDC credit request</text>
    <rect x="666" y="230" width="268" height="202" rx="20" fill="#0F172A"/><circle cx="711" cy="278" r="19" fill="#2563EB"/><text x="743" y="283" fill="white" font-family="Arial, sans-serif" font-size="21" font-weight="700">Funding auction</text><text x="696" y="333" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">Lenders compete on APR</text><text x="696" y="363" fill="#93C5FD" font-family="Arial, sans-serif" font-size="16" font-weight="700">Escrowed Arc USDC</text><text x="696" y="397" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14">Lowest eligible bids fund first</text>
    <rect x="1190" y="258" width="305" height="146" rx="18" fill="white" stroke="#BFDBFE" stroke-width="2"/><circle cx="1232" cy="300" r="18" fill="#DCFCE7"/><path d="M1224 300l6 6 11-13" stroke="#16A34A" stroke-width="2.5"/><text x="1262" y="300" fill="#0F172A" font-family="Arial, sans-serif" font-size="19" font-weight="700">Settlement waterfall</text><text x="1214" y="350" fill="#64748B" font-family="Arial, sans-serif" font-size="16">Fee → lenders → business</text><text x="1214" y="375" fill="#16A34A" font-family="Arial, sans-serif" font-size="15" font-weight="700">One USDC repayment</text>
  </g>
  <g fill="#2563EB"><circle cx="391" cy="331" r="10"/><circle cx="635" cy="331" r="10"/><circle cx="967" cy="331" r="10"/><circle cx="1158" cy="331" r="10"/></g>
  <text x="110" y="474" fill="#64748B" font-family="Arial, sans-serif" font-size="16">ARC TESTNET  •  CIRCLE WALLET PIN APPROVAL  •  CANONICAL USDC</text>
